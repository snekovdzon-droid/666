<!doctype html><meta charset=utf-8><body style="margin:0;background:#8d8a82"><canvas id=c></canvas>
<script src="../vendor/three.min.js"></script>
<script>
function parse(buf) {
  const d = new DataView(buf); let off = 8, size = null, vox = [], pal = null;
  const rd = (o, n) => String.fromCharCode(...new Uint8Array(buf, o, n));
  function walk(o, end) { while (o < end) { const id = rd(o, 4), cn = d.getUint32(o + 4, true), ch = d.getUint32(o + 8, true), s = o + 12;
    if (id === 'SIZE') size = [d.getUint32(s, true), d.getUint32(s + 4, true), d.getUint32(s + 8, true)];
    if (id === 'XYZI') { const n = d.getUint32(s, true); for (let i = 0; i < n; i++) vox.push([d.getUint8(s + 4 + i * 4), d.getUint8(s + 5 + i * 4), d.getUint8(s + 6 + i * 4), d.getUint8(s + 7 + i * 4)]); }
    if (id === 'RGBA') pal = new Uint8Array(buf, s, 1024);
    if (id === 'MAIN') walk(s + cn, s + cn + ch); o = s + cn + ch; } }
  walk(off, buf.byteLength); return { size, vox, pal };
}
window.show = async function (ids, cols) {
  const W = 300, rows = ids.length, cv = document.getElementById('c'); cv.width = W * cols; cv.height = W * rows;
  const r = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true }); r.setSize(W * cols, W * rows); r.setScissorTest(true); r.outputEncoding = THREE.sRGBEncoding;
  const sc = new THREE.Scene(); sc.background = new THREE.Color(0x8d8a82); sc.add(new THREE.HemisphereLight(0xffffff, 0x777777, 1.0)); const dl = new THREE.DirectionalLight(0xffffff, 0.9); dl.position.set(3, 4, 5); sc.add(dl);
  for (let i = 0; i < rows; i++) {
    const m = parse(await (await fetch('../assets/guns/' + ids[i] + '.vox')).arrayBuffer()), [sx, sy, sz] = m.size, g = new THREE.Group();
    const geo = new THREE.BoxGeometry(1, 1, 1), im = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial(), m.vox.length), mt = new THREE.Matrix4(), col = new THREE.Color();
    m.vox.forEach((v, k) => { mt.setPosition(v[0] - sx / 2, v[2] - sz / 2, v[1] - sy / 2); im.setMatrixAt(k, mt); const p = v[3] * 4 - 4; col.setRGB(m.pal[p] / 255, m.pal[p + 1] / 255, m.pal[p + 2] / 255).convertSRGBToLinear(); im.setColorAt(k, col); });
    g.add(im); sc.add(g); const R = Math.max(sx, sy, sz) * 0.62;
    const views = [[R * 2.2, 0, 0], [R * 1.3, R * 0.9, R * 1.3], [0.01, R * 2.4, 0.01], [R * 0.01, 0, R * 2.4]];
    for (let c = 0; c < cols; c++) { const cam = new THREE.OrthographicCamera(-R, R, R, -R, 0.1, 500); const v = views[c]; cam.position.set(v[0], v[1], v[2]); cam.up.set(0, 1, 0); if (c === 2) cam.up.set(0, 0, -1); cam.lookAt(0, 0, 0); r.setViewport(c * W, (rows - 1 - i) * W, W, W); r.setScissor(c * W, (rows - 1 - i) * W, W, W); r.render(sc, cam); }
    sc.remove(g);
  }
  return true;
};
</script>
